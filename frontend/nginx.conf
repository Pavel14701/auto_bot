# Docker-встроенный DNS + переменная в proxy_pass: nginx резолвит `backend`
# на каждый запрос (кэш 10с), а не один раз при старте — иначе после
# пересоздания контейнера backend (новый IP) миниапп отдаёт 502 Bad Gateway,
# пока сам не перезапущен.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    # index.html — без кэша: Telegram-вебвью кэширует его намертво, а после
    # пересборки старые хэшированные ассеты удаляются → приложение без CSS.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
    # AUTH-01: X-Real-IP и дополненный XFF — бэкенд берёт из них IP для
    # guest rate-limit. Без proxy_set_header nginx молчаливо пропускает
    # клиентский X-Forwarded-For дальше, и спуф одним заголовком обходил
    # лимит гостевых сессий.
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS с самоподписанным сертификатом (генерируется при старте контейнера).
# ВНИМАНИЕ: Telegram открывает web_app только с доверенным сертификатом;
# self-signed годится для браузера и локальной разработки.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
    # AUTH-01: X-Real-IP и дополненный XFF — бэкенд берёт из них IP для
    # guest rate-limit. Без proxy_set_header nginx молчаливо пропускает
    # клиентский X-Forwarded-For дальше, и спуф одним заголовком обходил
    # лимит гостевых сессий.
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
